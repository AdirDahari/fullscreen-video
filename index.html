<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סרטון במסך מלא</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* אופטימיזציה למובייל */
        @media (max-width: 768px) {
            iframe {
                width: 100vw;
                height: 100vh;
            }
        }
    </style>
</head>
<body>
    <iframe 
        src="https://www.youtube.com/embed/EbiH41aYmkg?autoplay=1&mute=1&loop=1&playlist=EbiH41aYmkg&controls=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>
</body>
</html>
